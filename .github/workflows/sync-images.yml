name: Sync public image assets
on:
  workflow_dispatch:
  schedule:
    # 5h 11m after the 11:00 UTC Global reset; allow post-patch mirrors to update.
    - cron: '11 16 * * *'
permissions:
  contents: write
concurrency:
  group: sync-images
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            .github
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pillow certifi
      - name: Load public operator records
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/arkpedia/arkpedia-data.git "$RUNNER_TEMP/arkpedia-data"
          git -C "$RUNNER_TEMP/arkpedia-data" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/arkpedia-data" sparse-checkout set \
            source/data/operators-1star source/data/operators-2star \
            source/data/operators-3star source/data/operators-4star \
            source/data/operators-5star source/data/operators-6star source/data/events
          git -C "$RUNNER_TEMP/arkpedia-data" checkout
      - name: Load base-skill identifiers
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/PuppiizSunniiz/ArknightsGameData_YoStar/main/en_US/gamedata/excel/building_data.json \
            --output "$RUNNER_TEMP/building-en.json"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Kengxxiao/ArknightsGameData/master/zh_CN/gamedata/excel/building_data.json \
            --output "$RUNNER_TEMP/building-cn.json"
      - name: Load skill identifiers
        # Shared generic skills (ATK Up γ, Support γ) use a common icon, not the
        # character-specific name; only the character→skill→icon join finds them.
        run: |
          for region in en_US:PuppiizSunniiz/ArknightsGameData_YoStar/main zh_CN:Kengxxiao/ArknightsGameData/master; do
            dir="${region%%:*}"; repo="${region#*:}"; tag="$([ "$dir" = en_US ] && echo en || echo cn)"
            for table in character_table skill_table; do
              curl --fail --location --retry 3 \
                "https://raw.githubusercontent.com/$repo/$dir/gamedata/excel/$table.json" \
                --output "$RUNNER_TEMP/$table-$tag.json"
            done
          done
      - name: Sync from the public resource mirror
        env:
          GH_TOKEN: ${{ github.token }}
          ARKPEDIA_DATA_ROOT: ${{ runner.temp }}/arkpedia-data
          ARKPEDIA_EN_BUILDING_DATA: ${{ runner.temp }}/building-en.json
          ARKPEDIA_CN_BUILDING_DATA: ${{ runner.temp }}/building-cn.json
          ARKPEDIA_EN_CHARACTER_TABLE: ${{ runner.temp }}/character_table-en.json
          ARKPEDIA_EN_SKILL_TABLE: ${{ runner.temp }}/skill_table-en.json
          ARKPEDIA_CN_CHARACTER_TABLE: ${{ runner.temp }}/character_table-cn.json
          ARKPEDIA_CN_SKILL_TABLE: ${{ runner.temp }}/skill_table-cn.json
        run: python scripts/sync_images.py
      - name: Sync recurring Standard and Kernel banner art
        run: |
          python scripts/sync_recurring_banner_art.py
          git add asset-manifest.json sources/recurring-banner-art.json headhunting-banner-images
      - name: Test Global artwork selection
        run: python -m unittest discover -s scripts -p 'test_global_banner_art.py'
      - name: Sync Global event and featured banner art
        env:
          ARKPEDIA_DATA_ROOT: ${{ runner.temp }}/arkpedia-data
        run: python scripts/sync_global_banner_art.py
      - name: Validate changed media and complete inventory
        run: python scripts/validate_images.py --staged
      - name: Publish validated assets
        run: |
          git diff --cached --quiet && exit 0
          git config user.name 'arkpedia-bot'
          git config user.email 'arkpedia-bot@users.noreply.github.com'
          git commit -m 'Sync validated public image assets'
          git push
